name: Refresh NYC pilot

# Offset from DC (8:41), Chicago (9:53), and Boston (10:17) to avoid
# concurrent scheduler slot contention.
on:
  schedule:
    - cron: "07 11 * * 1"  # Mondays, 11:07am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-nyc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run NYC pilot pipeline
        run: python3 etl/nyc/transform_nyc.py
      - name: Commit updated artifacts if changed
        run: |
          git config user.name "ebike-crash-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/nyc_pilot.json web/data/nyc_bike_lanes.geojson
          git diff --staged --quiet || git commit -m "Auto-refresh NYC pilot data"
          git push
