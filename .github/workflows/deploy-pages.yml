name: Deploy dashboard to GitHub Pages

# Publishes web/ as a static site whenever main updates -- including the
# automated commits from refresh-news.yml, so a new crash report goes from
# "GDELT indexed it" to "live on the public page" with no manual step.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # GitHub deliberately does NOT let a commit made by GITHUB_TOKEN (e.g.
  # the news-refresh bot's auto-commit) trigger other workflows via `push`
  # -- it's a loop-prevention safeguard. Without this, the bot's data
  # updates would land in the repo but the live site would never redeploy.
  # workflow_run fires regardless of who/what triggered the upstream run.
  workflow_run:
    workflows: ["Refresh news-sourced incident reports", "Refresh risk & prevention layer", "Refresh DC pilot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
